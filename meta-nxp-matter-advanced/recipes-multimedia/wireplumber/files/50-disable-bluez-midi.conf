# MATTER-4522: Disable the WirePlumber BLE-MIDI monitor.
#
# The bluez-midi monitor registers a BLE-MIDI GATT service whose MIDI I/O
# characteristic carries the "encrypt-read" flag. During Matter BLE
# commissioning, a commissioner (e.g. Raspberry Pi Test Harness) enumerating
# the GATT database reads that characteristic, gets ATT "Insufficient
# Encryption (0x0f)", and triggers SMP pairing. With no pairing agent on the
# commissioner the SMP exchange fails, the BLE link drops, and commissioning
# times out (PASE timeout). i.MX does not use BLE-MIDI, so disabling this
# monitor removes the trigger without affecting Bluetooth audio (A2DP/HFP).
wireplumber.profiles = {
  main = {
    monitor.bluez-midi = disabled
  }
}
