#@TYPE: Machine
#@NAME: A consolidated IW610 MATTER machine for i.MX 93W EVK
#@SOC: i.MX93W
#@MAINTAINER: Junmeng Li <junmeng.li_1@nxp.com>

MACHINEOVERRIDES =. "imx93w-14x12-lpddr4x-evk:"
require conf/machine/imx93w-14x12-lpddr4x-evk.conf

UBOOT_DELTA_CONFIG = "${UNPACKDIR}/uboot-config/*"

KERNEL_DEVICETREE += " \
    freescale/imx93w-14x12-evk-iw610.dtb \
"
DTS_FILE = "${BSPDIR}/sources/meta-nxp-connectivity/meta-nxp-otbr/recipes-kernel/linux/files/dts/imx93w-14x12-evk-iw610.dts"

IMAGE_INSTALL:append = " packagegroup-nxp-matter-baseline packagegroup-nxp-openthread packagegroup-nxp-otbr docker-moby "

# Set to true to enable EdgeLock Enclave
USE_ELE = "true"

# Indicates the machine supports IWxxx modules
MACHINE_FEATURES += "has-iwxxx"

MACHINE_FIRMWARE:append = " firmware-nxp-wifi-nxpiw610-sdio"
